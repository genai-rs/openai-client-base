[package]
name = "openai-client-base"
version = "0.16.0"
authors = ["Tim Van Wassenhove <github@timvw.be>"]
description = "Auto-generated Rust client for the OpenAI API"
license = "MIT OR Apache-2.0"
edition = "2021"
repository = "https://github.com/genai-rs/openai-client-base"
homepage = "https://github.com/genai-rs/openai-client-base"
documentation = "https://docs.rs/openai-client-base"
readme = "README.md"
keywords = ["openai", "api", "client", "generated"]
categories = ["api-bindings"]
rust-version = "1.88"
exclude = ["docs/", "stainless.yaml", "migration/", "scripts/", ".github/", "*.backup", "PIPELINE.md", "MIGRATION-*.md"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["rustls"]
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
bon = { version = "^3.10.2" }
serde = { version = "^1.0.229", features = ["derive"] }
serde_with = { version = "^3.24.0", features = ["base64", "std", "macros"], default-features = false }
serde_json = { version = "^1.0.151" }
serde_repr = { version = "^0.1.21" }
url = { version = "^2.5.8" }
tokio = { version = "^1.53.2", features = ["fs"] }
tokio-util = { version = "^0.7.19", features = ["codec"] }
reqwest = { version = "^0.13.5", features = ["json", "multipart", "stream", "query"], default-features = false }
reqwest-middleware = { version = "^0.5.2", features = ["json", "multipart", "query"] }

[dev-dependencies]
anyhow = { version = "^1.0.104" }
tokio = { version = "^1.53.2", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
