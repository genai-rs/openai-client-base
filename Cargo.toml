[package]
name = "openai-client-base"
version = "0.14.0"
authors = ["Tim Van Wassenhove <github@timvw.be>"]
description = "Auto-generated Rust client for the OpenAI API"
license = "MIT OR Apache-2.0"
edition = "2021"
repository = "https://github.com/genai-rs/openai-client-base"
homepage = "https://github.com/genai-rs/openai-client-base"
documentation = "https://docs.rs/openai-client-base"
readme = "README.md"
keywords = ["openai", "api", "client", "generated"]
categories = ["api-bindings"]
rust-version = "1.88"

[dependencies]
bon = "^3.10.1"
serde = { version = "^1.0.229", features = ["derive"] }
serde_with = { version = "^3.23.0", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0.151"
serde_repr = "^0.1.21"
url = "^2.5.8"
tokio = { version = "^1.53.1", features = ["fs"] }
tokio-util = { version = "^0.7.19", features = ["codec"] }
reqwest = { version = "^0.13.4", default-features = false, features = ["json", "multipart", "stream", "query"] }
reqwest-middleware = { version = "^0.5.2", features = ["json", "multipart", "query"] }

[dev-dependencies]
anyhow = "^1.0.104"
tokio = { version = "^1.53.1", features = ["rt-multi-thread", "macros"] }
