# Configuration for release-plz
# https://release-plz.ieni.dev/docs/config

[workspace]
# Enable changelog generation
changelog_update = true

# Enable git releases and tags
git_release_enable = true
git_tag_enable = true
pr_branch_prefix = "automated/release-plz/"

# PR settings
pr_labels = ["release", "automated"]
pr_draft = false
pr_name = "chore: release version {{version}}"

# Publishing
publish = true

# GitHub release body template
git_release_body = """
## What's Changed

{%- if changelog %}
{{ changelog }}
{%- else %}
_No changelog available_
{%- endif %}
"""

# PR body template  
pr_body = """
{%- for release in releases -%}
## 📦 {{ release.package }} {{ release.previous_version }} → {{ release.next_version }}

### 🔗 Compare Changes
[**View all changes since v{{ release.previous_version }}**](https://github.com/genai-rs/openai-client-base/compare/v{{ release.previous_version }}...HEAD)

### API compatibility review

Automatic API compatibility checks are disabled for this generated crate because
rustdoc exceeds standard runner memory. Review the API changes and proposed
version before merging; mark breaking changes with `!` or `BREAKING CHANGE:`.

{%- if release.changelog %}

### 📋 Changelog

{{ release.changelog }}
{%- else %}

_No changelog available for this release_
{%- endif %}

{%- endfor %}

---
_This PR was generated by [release-plz](https://github.com/MarcoIeni/release-plz/)_
"""

[[package]]
name = "openai-client-base"
# cargo-semver-checks generates rustdoc JSON, which exceeds standard runner
# memory for this client. See scripts/README.md for evidence and manual checks.
semver_check = false
