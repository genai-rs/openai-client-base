# Configuration for release-plz
# https://release-plz.ieni.dev/docs/config

[workspace]
# The client is a Cargo workspace (timvw-rust splitCrates): the facade
# openai-client-base and the crates it re-exports (crates/). They are released
# together with one version (version_group below); the facade pins the others
# with `=`. Only the facade has a changelog, tags and GitHub releases: the other
# crates are internal. Their packages are listed below, so a crate added to
# scripts/api-features.yaml (`crate:`) must be added here too.
changelog_update = false
git_release_enable = false
git_tag_enable = false
pr_branch_prefix = "automated/release-plz/"

# PR settings
pr_labels = ["release", "automated"]
pr_draft = false
pr_name = "chore: release version {{version}}"

# Publishing
publish = true

# GitHub release body template
git_release_body = """
## What's Changed

{%- if changelog %}
{{ changelog }}
{%- else %}
_No changelog available_
{%- endif %}
"""

# PR body template  
pr_body = """
{%- for release in releases -%}
{%- if release.package == "openai-client-base" %}
## 📦 {{ release.package }} {{ release.previous_version }} → {{ release.next_version }}

### 🔗 Compare Changes
[**View all changes since v{{ release.previous_version }}**](https://github.com/genai-rs/openai-client-base/compare/v{{ release.previous_version }}...HEAD)

### API compatibility review

Automatic API compatibility checks are disabled for this generated crate because
rustdoc exceeds standard runner memory. Review the API changes and proposed
version before merging; mark breaking changes with `!` or `BREAKING CHANGE:`.

For generated client changes, follow the generated-client PR in this release's
compare link and review its `api-change-report` artifact from the linked Generate
Client workflow run. The report is limited evidence, not complete Rust semver
analysis. Require explicit maintainer or designated senior reviewer approval for
flagged removals before merging this release PR; record the accepted head,
affected surface, migration and version decision. Keep the linked generation PR
and workflow artifact available as release evidence; a successful generation
does not approve API compatibility.

{%- if release.changelog %}

### 📋 Changelog

{{ release.changelog }}
{%- else %}

_No changelog available for this release_
{%- endif %}
{%- endif %}

{%- endfor %}

The crates of the workspace (`openai-client-base-*`, internal) are released
with the same version.

---
_This PR was generated by [release-plz](https://github.com/MarcoIeni/release-plz/)_
"""

[[package]]
name = "openai-client-base"
version_group = "openai-client-base"
changelog_update = true
changelog_path = "./CHANGELOG.md"
git_release_enable = true
git_tag_enable = true
# The tags of the single crate (v0.36.2): with several packages release-plz
# would name them <package>-v<version>.
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
# cargo-semver-checks generates rustdoc JSON, which exceeded standard runner
# memory for the single crate. See scripts/README.md for evidence and manual
# checks.
semver_check = false


