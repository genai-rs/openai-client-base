# Cargo feature groups (timvw-rust `apiFeaturesFile`), named after async-openai 0.43's features. Each group selects
# operations by OpenAPI tag and/or path prefix (60 OpenAI operations have no tag). See
# https://github.com/timvw/openapi-generator-timvw-rust/blob/main/docs/guides/api-features.md
#
# `crate:` (timvw-rust `splitCrates`) puts the group into the workspace crate `openai-client-base-<crate>`; the
# facade `openai-client-base` re-exports every crate under the same paths and features. Groups that share models
# share a crate where that keeps the crates small: each crate should stay well under ~70k generated lines, so that
# it compiles and documents in a fraction of docs.rs' memory. Models more than one crate uses are in
# `openai-client-base-common`, models no operation uses in `openai-client-base-untagged`.
administration:
  crate: administration
  tags: [Audit Logs, Certificates, Data retention, Groups, Group users,
         Group organization role assignments, Invites, Projects, Project groups,
         Project group role assignments, Project user role assignments, Roles,
         Spend alerts, Usage, Users, User organization role assignments, Hosted tools]
  paths: [/organization]
audio:              { tags: [Audio], crate: realtime }
batch:              { tags: [Batch], crate: assistants }
chat-completion:    { tags: [Chat], crate: chat }
chatkit:            { paths: [/chatkit], crate: tools }
completions:        { tags: [Completions], crate: chat }
container:          { paths: [/containers], crate: tools }
content-provenance-checks: { paths: [/content_provenance_checks], crate: platform }
decisions:          { tags: [Decisions], crate: platform }
embedding:          { tags: [Embeddings], crate: chat }
evals:              { tags: [Evals], crate: finetuning }
file:               { tags: [Files], crate: assistants }
finetuning:         { tags: [Fine-tuning], crate: finetuning }
image:              { tags: [Images], crate: chat }
model:              { tags: [Models], crate: chat }
moderation:         { tags: [Moderations], crate: chat }
realtime:           { tags: [Realtime], crate: realtime }
responses:          { tags: [Responses, Conversations], crate: responses }
safety:             { paths: [/safety], crate: platform }
skill:              { tags: [Skills], crate: tools }
upload:             { tags: [Uploads], crate: assistants }
vectorstore:        { tags: [Vector stores], crate: assistants }
video:              { tags: [Videos], crate: platform }
webhook:            { paths: [/webhook_endpoints, /webhook_event_types], crate: platform }
assistants:         { tags: [Assistants], crate: assistants }
agents:             { tags: [Agents], crate: agents }
live:               { tags: [Live], crate: realtime }
vaults:             { tags: [Vaults], crate: tools }
# The feature of the webhook events (generator option webhookModule), named after its module.
open-ai-client-base-webhooks: { crate: platform }
