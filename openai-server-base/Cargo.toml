[package]
name = "openai-server-base"
version = "0.1.0"
authors = ["Tim Van Wassenhove <github@timvw.be>"]
description = "Auto-generated axum server for the OpenAI API, with openai-client-base's models"
license = "MIT OR Apache-2.0"
edition = "2021"
repository = "https://github.com/genai-rs/openai-client-base"
documentation = "https://docs.rs/openai-server-base"
readme = "README.md"
keywords = ["openai", "api", "server", "axum", "generated"]
categories = ["api-bindings", "web-programming::http-server"]
rust-version = "1.88"

[package.metadata.docs.rs]
all-features = true

# Generated by scripts/generate.sh with timvw-rust (targets ["server"], modelsCrate openai-client-base); keep the
# [dependencies] and [features] in step with what the generator writes when the groups or the spec's tags change.
[dependencies]
# The models: openai-client-base's, generated from the same spec with the same model options.
openai-client-base = { version = "0.34.3", path = "..", default-features = false }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
url = "^2.5"
axum = { version = "^0.8", default-features = false, features = ["multipart"] }
futures-util = { version = "^0.3", default-features = false, features = ["std"] }
http = { version = "^1" }

[features]
default = ["full"]
# API features (apiFeatures): `<group>` compiles the group's models and its server operations, `<group>-types` only
# its models. `types` is every model, `full` everything.
full = [
    "administration",
    "agents",
    "assistants",
    "audio",
    "batch",
    "chat-completion",
    "chatkit",
    "completions",
    "container",
    "content-provenance-checks",
    "decisions",
    "embedding",
    "evals",
    "file",
    "finetuning",
    "image",
    "live",
    "model",
    "moderation",
    "open-ai-client-base-webhooks",
    "realtime",
    "responses",
    "safety",
    "skill",
    "upload",
    "vaults",
    "vectorstore",
    "video",
    "webhook",
    "types",
]
types = [
    "administration-types",
    "agents-types",
    "assistants-types",
    "audio-types",
    "batch-types",
    "chat-completion-types",
    "chatkit-types",
    "completions-types",
    "container-types",
    "content-provenance-checks-types",
    "decisions-types",
    "embedding-types",
    "evals-types",
    "file-types",
    "finetuning-types",
    "image-types",
    "live-types",
    "model-types",
    "moderation-types",
    "open-ai-client-base-webhooks-types",
    "realtime-types",
    "responses-types",
    "safety-types",
    "skill-types",
    "upload-types",
    "vaults-types",
    "vectorstore-types",
    "video-types",
    "webhook-types",
    "openai-client-base/types",
]
_api = []
# tags Audit Logs, Certificates, Data retention, Groups, Group users, Group organization role assignments, Invites, Projects, Project groups, Project group role assignments, Project user role assignments, Roles, Spend alerts, Usage, Users, User organization role assignments, Hosted tools; paths under `/organization`
administration = ["administration-types", "_api"]
administration-types = ["openai-client-base/administration-types"]
# tag Agents
agents = ["agents-types", "_api"]
agents-types = ["openai-client-base/agents-types"]
# tag Assistants
assistants = ["assistants-types", "_api"]
assistants-types = ["openai-client-base/assistants-types"]
# tag Audio
audio = ["audio-types", "_api"]
audio-types = ["openai-client-base/audio-types"]
# tag Batch
batch = ["batch-types", "_api"]
batch-types = ["openai-client-base/batch-types"]
# tag Chat
chat-completion = ["chat-completion-types", "_api"]
chat-completion-types = ["openai-client-base/chat-completion-types"]
# paths under `/chatkit`
chatkit = ["chatkit-types", "_api"]
chatkit-types = ["openai-client-base/chatkit-types"]
# tag Completions
completions = ["completions-types", "_api"]
completions-types = ["openai-client-base/completions-types"]
# paths under `/containers`
container = ["container-types", "_api"]
container-types = ["openai-client-base/container-types"]
# paths under `/content_provenance_checks`
content-provenance-checks = ["content-provenance-checks-types", "_api"]
content-provenance-checks-types = ["openai-client-base/content-provenance-checks-types"]
# tag Decisions
decisions = ["decisions-types", "_api"]
decisions-types = ["openai-client-base/decisions-types"]
# tag Embeddings
embedding = ["embedding-types", "_api"]
embedding-types = ["openai-client-base/embedding-types"]
# tag Evals
evals = ["evals-types", "_api"]
evals-types = ["openai-client-base/evals-types"]
# tag Files
file = ["file-types", "_api"]
file-types = ["openai-client-base/file-types"]
# tag Fine-tuning
finetuning = ["finetuning-types", "_api"]
finetuning-types = ["openai-client-base/finetuning-types"]
# tag Images
image = ["image-types", "_api"]
image-types = ["openai-client-base/image-types"]
# tag Live
live = ["live-types", "_api"]
live-types = ["openai-client-base/live-types"]
# tag Models
model = ["model-types", "_api"]
model-types = ["openai-client-base/model-types"]
# tag Moderations
moderation = ["moderation-types", "_api"]
moderation-types = ["openai-client-base/moderation-types"]
# tag OpenAiClientBaseWebhooks
open-ai-client-base-webhooks = ["open-ai-client-base-webhooks-types", "_api"]
open-ai-client-base-webhooks-types = ["openai-client-base/open-ai-client-base-webhooks-types"]
# tag Realtime
realtime = ["realtime-types", "_api"]
realtime-types = ["openai-client-base/realtime-types"]
# tags Responses, Conversations
responses = ["responses-types", "_api"]
responses-types = ["openai-client-base/responses-types"]
# paths under `/safety`
safety = ["safety-types", "_api"]
safety-types = ["openai-client-base/safety-types"]
# tag Skills
skill = ["skill-types", "_api"]
skill-types = ["openai-client-base/skill-types"]
# tag Uploads
upload = ["upload-types", "_api"]
upload-types = ["openai-client-base/upload-types"]
# tag Vaults
vaults = ["vaults-types", "_api"]
vaults-types = ["openai-client-base/vaults-types"]
# tag Vector stores
vectorstore = ["vectorstore-types", "_api"]
vectorstore-types = ["openai-client-base/vectorstore-types"]
# tag Videos
video = ["video-types", "_api"]
video-types = ["openai-client-base/video-types"]
# paths under `/webhook_endpoints`, `/webhook_event_types`
webhook = ["webhook-types", "_api"]
webhook-types = ["openai-client-base/webhook-types"]
