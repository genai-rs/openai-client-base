[package]
name = "openai-mock-server"
version = "0.1.0"
authors = ["Tim Van Wassenhove <github@timvw.be>"]
description = "A scripted mock of the OpenAI API for tests, served by the generated openai-server-base"
license = "MIT OR Apache-2.0"
edition = "2021"
repository = "https://github.com/genai-rs/openai-client-base"
documentation = "https://docs.rs/openai-mock-server"
readme = "README.md"
keywords = ["openai", "mock", "testing", "server"]
categories = ["development-tools::testing"]
rust-version = "1.88"

[dependencies]
openai-server-base = { version = "0.1.0", path = "../openai-server-base", default-features = false, features = [
    "audio",
    "batch",
    "chat-completion",
    "embedding",
    "file",
    "image",
    "model",
    "moderation",
    "realtime",
    "responses",
] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "http2"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }

[dev-dependencies]
openai-client-base = { version = "0.34.2", path = "..", default-features = false, features = [
    "rustls",
    "audio",
    "batch",
    "chat-completion",
    "embedding",
    "file",
    "model",
    "moderation",
    "realtime",
    "responses",
] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false }
timvw-rust-runtime = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
