[package]
name = "openai-client-base-chat"
description = "Internal part of openai-client-base: the models and API functions of the features `chat-completion`, `completions`, `embedding`, `image`, `model`, `moderation`. Depend on openai-client-base instead"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[dependencies]
openai-client-base-common = { workspace = true }
bon = { version = "^3.10.3", optional = true }
serde = { version = "^1.0.229", features = ["derive"] }
serde_with = { version = "^3.25.0", default-features = false, features = ["base64", "std", "macros"], optional = true }
serde_json = "^1.0.154"
futures-core = "^0.3.34"
serde_repr = "^0.1.21"
url = "^2.5.9"
regex = "^1.13.2"
jiff = { version = "^1.0.2", default-features = false, features = ["std", "serde"] }
timvw-rust-runtime = { version = "^0.4.2", default-features = false, features = ["fs", "time"], optional = true }

[features]
default = []
_api = ["dep:timvw-rust-runtime", "dep:bon", "openai-client-base-common/_api"]
chat-completion = ["chat-completion-types", "_api"]
chat-completion-types = ["dep:bon", "dep:serde_with", "openai-client-base-common/chat-completion-types"]
completions = ["completions-types", "_api"]
completions-types = ["dep:bon", "dep:serde_with", "openai-client-base-common/completions-types"]
embedding = ["embedding-types", "_api"]
embedding-types = ["dep:bon", "dep:serde_with", "openai-client-base-common/embedding-types"]
image = ["image-types", "_api"]
image-types = ["dep:bon", "dep:serde_with", "openai-client-base-common/image-types"]
model = ["model-types", "_api"]
model-types = ["dep:bon", "dep:serde_with", "openai-client-base-common/model-types"]
moderation = ["moderation-types", "_api"]
moderation-types = ["dep:bon", "dep:serde_with", "openai-client-base-common/moderation-types"]

[lints]
workspace = true
