[package]
name = "openai-client-base-platform"
description = "Internal part of openai-client-base: the models and API functions of the features `content-provenance-checks`, `decisions`, `open-ai-client-base-webhooks`, `safety`, `video`, `webhook`. Depend on openai-client-base instead"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[dependencies]
openai-client-base-common = { workspace = true }
bon = { version = "^3.10.3", optional = true }
serde = { version = "^1.0.229", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"], optional = true }
serde_json = "^1.0.154"
futures-core = "^0.3.34"
serde_repr = "^0.1.21"
url = "^2.5.9"
regex = "^1.13.2"
jiff = { version = "^1.0.2", default-features = false, features = ["std", "serde"] }
timvw-rust-runtime = { version = "^0.4.2", default-features = false, features = ["fs", "time"], optional = true }

[features]
default = []
_api = ["dep:timvw-rust-runtime", "dep:bon", "openai-client-base-common/_api"]
content-provenance-checks = ["content-provenance-checks-types", "_api"]
content-provenance-checks-types = ["dep:bon", "dep:serde_with", "openai-client-base-common/content-provenance-checks-types"]
decisions = ["decisions-types", "_api"]
decisions-types = ["dep:bon", "dep:serde_with", "openai-client-base-common/decisions-types"]
open-ai-client-base-webhooks = ["open-ai-client-base-webhooks-types", "_api"]
open-ai-client-base-webhooks-types = ["dep:bon", "openai-client-base-common/open-ai-client-base-webhooks-types"]
safety = ["safety-types", "_api"]
safety-types = ["dep:bon", "dep:serde_with", "openai-client-base-common/safety-types"]
video = ["video-types", "_api"]
video-types = ["dep:timvw-rust-runtime", "dep:bon", "dep:serde_with", "openai-client-base-common/video-types"]
webhook = ["webhook-types", "_api"]
webhook-types = ["dep:bon", "dep:serde_with", "openai-client-base-common/webhook-types"]

[lints]
workspace = true
