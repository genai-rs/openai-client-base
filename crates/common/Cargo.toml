[package]
name = "openai-client-base-common"
description = "Internal part of openai-client-base: the models several feature groups use, the configuration, errors and helpers. Depend on openai-client-base instead"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[dependencies]
bon = { version = "^3.10.3", optional = true }
serde = { version = "^1.0.229", features = ["derive"] }
serde_with = { version = "^3.25.0", default-features = false, features = ["base64", "std", "macros"], optional = true }
serde_json = "^1.0.154"
futures-core = "^0.3.34"
serde_repr = "^0.1.21"
url = "^2.5.9"
regex = "^1.13.2"
jiff = { version = "^1.0.2", default-features = false, features = ["std", "serde"] }
timvw-rust-runtime = { version = "^0.4.2", default-features = false, features = ["fs", "time"], optional = true }

[features]
default = []
_api = ["dep:timvw-rust-runtime", "dep:bon"]
native-tls = ["timvw-rust-runtime?/native-tls"]
rustls = ["timvw-rust-runtime?/rustls"]
retry = ["timvw-rust-runtime?/retry"]
tracing = ["timvw-rust-runtime?/tracing"]
administration-types = ["dep:bon", "dep:serde_with"]
agents-types = ["dep:bon", "dep:serde_with"]
assistants-types = ["dep:bon", "dep:serde_with"]
audio-types = ["dep:bon", "dep:serde_with"]
batch-types = ["dep:bon", "dep:serde_with"]
chat-completion-types = ["dep:bon", "dep:serde_with"]
chatkit-types = ["dep:bon", "dep:serde_with"]
completions-types = ["dep:bon", "dep:serde_with"]
container-types = ["dep:timvw-rust-runtime", "dep:bon", "dep:serde_with"]
content-provenance-checks-types = ["dep:bon", "dep:serde_with"]
decisions-types = ["dep:bon", "dep:serde_with"]
embedding-types = ["dep:bon", "dep:serde_with"]
evals-types = ["dep:bon", "dep:serde_with"]
file-types = ["dep:bon", "dep:serde_with"]
finetuning-types = ["dep:bon", "dep:serde_with"]
image-types = ["dep:bon", "dep:serde_with"]
live-types = ["dep:bon", "dep:serde_with"]
model-types = ["dep:bon", "dep:serde_with"]
moderation-types = ["dep:bon", "dep:serde_with"]
open-ai-client-base-webhooks-types = ["dep:bon"]
realtime-types = ["dep:bon", "dep:serde_with"]
responses-types = ["dep:bon", "dep:serde_with"]
safety-types = ["dep:bon", "dep:serde_with"]
skill-types = ["dep:timvw-rust-runtime", "dep:bon", "dep:serde_with"]
upload-types = ["dep:bon", "dep:serde_with"]
vaults-types = ["dep:bon", "dep:serde_with"]
vectorstore-types = ["dep:bon", "dep:serde_with"]
video-types = ["dep:timvw-rust-runtime", "dep:bon", "dep:serde_with"]
webhook-types = ["dep:bon", "dep:serde_with"]

[lints]
workspace = true
