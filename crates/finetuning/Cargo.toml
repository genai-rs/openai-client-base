[package]
name = "openai-client-base-finetuning"
description = "Internal part of openai-client-base: the models and API functions of the features `evals`, `finetuning`. Depend on openai-client-base instead"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[dependencies]
openai-client-base-common = { workspace = true }
bon = { version = "^3.10.3", optional = true }
serde = { version = "^1.0.229", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"], optional = true }
serde_json = "^1.0.154"
futures-core = "^0.3"
serde_repr = "^0.1"
url = "^2.5.9"
regex = "^1.13.2"
jiff = { version = "^1.0.2", default-features = false, features = ["std", "serde"] }
timvw-rust-runtime = { version = "^0.4", default-features = false, features = ["fs", "time"], optional = true }

[features]
default = []
_api = ["dep:timvw-rust-runtime", "dep:bon", "openai-client-base-common/_api"]
evals = ["evals-types", "_api"]
evals-types = ["dep:bon", "dep:serde_with", "openai-client-base-common/evals-types"]
finetuning = ["finetuning-types", "_api"]
finetuning-types = ["dep:bon", "dep:serde_with", "openai-client-base-common/finetuning-types"]

[lints]
workspace = true
