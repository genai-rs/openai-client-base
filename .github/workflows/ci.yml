name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: genai-rs/.github/.github/workflows/rust-ci.yml@main
    with:
      msrv: "1.88"
      generated-crate: true
      os-matrix: '["ubuntu-latest"]'
      # rustdoc is OOM-killed on hosted runners for this crate.
      run-doc: false
    secrets: inherit

  python-tests:
    name: Generation patch tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Test generation patches
        run: python3 -m unittest discover -s scripts/tests -v
