name: Generate Client

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Update the generated-client PR (main branch only)'
        type: boolean
        default: false

concurrency:
  group: generate-client-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Mint short-lived GitHub App token (ensures PR events trigger CI)
      - name: Create GitHub App token
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
          python-version: '3.12.4'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ripgrep

      # Save the checked-in upstream input and generated surface before
      # generate.sh replaces them with the latest upstream specification.
      - name: Capture API change baseline
        run: |
          mkdir -p target/reports/api-change
          generator_version="${OPENAPI_GENERATOR_VERSION:-$(sed -n 's/^OPENAPI_GENERATOR_VERSION="${OPENAPI_GENERATOR_VERSION:-\([^}]*\)}"$/\1/p' scripts/generate.sh)}"
          test -n "$generator_version"
          uv run --with pyyaml python scripts/api_change_report.py snapshot \
            --spec stainless.yaml --generated-root . \
            --source-url https://raw.githubusercontent.com/openai/openai-openapi/main/openapi.yaml \
            --generator-version "$generator_version" --revision "$(git rev-parse HEAD)" \
            --output target/reports/api-change/before.json

      - name: Generate client
        env:
          OPENAPI_GENERATOR_LOG_LEVEL: error
        run: |
          # The script handles everything internally:
          # - Downloads and validates latest published OpenAI OpenAPI spec
          # - Runs 2-layer patching pipeline
          # - Generates using Docker
          # - Applies post-generation patches
          chmod +x ./scripts/generate.sh
          ./scripts/generate.sh

      - name: Verify generation succeeded
        run: |
          # Ensure critical files exist
          test -f src/lib.rs || (echo "Error: src/lib.rs not found after generation" && exit 1)
          test -f Cargo.toml || (echo "Error: Cargo.toml not found after generation" && exit 1)
          
          # Verify the code compiles and passes checks
          echo "🔨 Building..."
          cargo build --all-features
          
          echo "📋 Running clippy..."
          cargo clippy --all-features --all-targets -- -D warnings
          
          echo "🧪 Running tests..."
          cargo test --all-features

          echo "🎨 Checking formatting..."
          cargo fmt --all -- --check

      - name: Compare generated API with baseline
        id: api-report
        run: |
          generator_version="${OPENAPI_GENERATOR_VERSION:-$(sed -n 's/^OPENAPI_GENERATOR_VERSION="${OPENAPI_GENERATOR_VERSION:-\([^}]*\)}"$/\1/p' scripts/generate.sh)}"
          test -n "$generator_version"
          uv run --with pyyaml python scripts/api_change_report.py snapshot \
            --spec stainless.yaml --generated-root . \
            --source-url https://raw.githubusercontent.com/openai/openai-openapi/main/openapi.yaml \
            --generator-version "$generator_version" \
            --revision "$(git rev-parse HEAD)+run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output target/reports/api-change/after.json
          uv run --with pyyaml python scripts/api_change_report.py compare \
            --before target/reports/api-change/before.json \
            --after target/reports/api-change/after.json \
            --json-output target/reports/api-change/report.json \
            --markdown-output target/reports/api-change/report.md
          cat target/reports/api-change/report.md >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          report = json.loads(Path('target/reports/api-change/report.json').read_text())
          print(f"review_required={str(report['review_required']).lower()}")
          print(f"removals_flagged={str(report['removals_flagged']).lower()}")
          PY

      - name: Upload API change review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-change-report
          path: |
            target/reports/api-change/before.json
            target/reports/api-change/after.json
            target/reports/api-change/report.json
            target/reports/api-change/report.md
          if-no-files-found: warn

      - name: Check downstream consumer compatibility
        env:
          CARGO_BUILD_JOBS: '2'
          DOWNSTREAM_RESULTS_DIR: ${{ runner.temp }}/downstream-results
        run: |
          # Record current main independently of the branch running generation.
          git fetch --no-tags origin main
          ./scripts/check-downstream.sh "$GITHUB_WORKSPACE" "$(git rev-parse FETCH_HEAD)"

      - name: Upload downstream compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: downstream-compatibility
          path: ${{ runner.temp }}/downstream-results
          if-no-files-found: ignore

      - name: Cleanup transient files
        run: |
          rm -rf scripts/__pycache__ || true

      - name: Check for changes
        id: changes
        run: |
          # Only consider generated outputs from the pipeline
          ALLOWED_PATHS=(
            src
            docs
            README.md
            Cargo.toml
            Cargo.lock
            stainless.yaml
            .openapi-generator
            .openapi-generator-ignore
          )
          if [ -n "$(git status --porcelain -- "${ALLOWED_PATHS[@]}")" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      # Older generated PRs may still carry the label consumed by the
      # genai-ci-bot auto-merge workflow. Remove that path before updating them.
      - name: Disable existing generated PR auto-merge
        if: steps.changes.outputs.changes == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pull_request="$(gh pr list --state open --head auto-update/client-generation --json number --jq '.[0].number // empty')"
          if [ -n "$pull_request" ]; then
            auto_merge="$(gh pr view "$pull_request" --json autoMergeRequest --jq '.autoMergeRequest != null')"
            if [ "$auto_merge" = true ]; then
              gh pr merge "$pull_request" --disable-auto
            fi
            has_automerge_label="$(gh pr view "$pull_request" --json labels --jq 'any(.labels[].name; . == "automerge")')" || {
              echo "::error::Could not read generated PR labels; refusing to update a PR without checking its auto-merge label." >&2
              exit 1
            }
            case "$has_automerge_label" in
              true)
                gh pr edit "$pull_request" --remove-label automerge
                ;;
              false)
                ;;
              *)
                echo "::error::Unexpected auto-merge label query result: $has_automerge_label" >&2
                exit 1
                ;;
            esac
          fi

      - name: Create Pull Request
        id: cpr
        if: steps.changes.outputs.changes == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: update generated client from latest OpenAPI spec"
          title: "chore: update generated client"
          body: |
            ## 🤖 Automated Client Update
            
            This PR updates the generated client based on the latest published OpenAI OpenAPI specification.
            
            ### Changes
            - Downloaded and validated the latest spec from [OpenAI's specification repository](https://github.com/openai/openai-openapi/blob/main/openapi.yaml)
            - Applied Layer 1 patches (model field fixes)
            - Applied Layer 2 patches (Rust compatibility)
            - Generated new client code
            - Applied post-generation patches
            
            ### Verification
            ✅ Code compiles successfully
            ✅ All tests pass
            ✅ Clippy checks pass
            
            ### API compatibility review required

            This PR does not auto-merge. Review the **api-change-report** artifact and
            report in the linked [Generate Client workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            The report flags removed operations/models, changed required fields and
            enum wire values, and changes to generated Rust files. It is not complete
            Rust semver analysis. A flagged removal requires explicit maintainer or
            designated senior reviewer approval before merging. Include the accepted
            head, affected surface, migration and version decision in the review.
            A PR with a flagged removal stays in draft until a reviewer marks it ready.

            Release reviewers can follow this generation PR from the release
            comparison and use its workflow run to inspect the report artifact.
            A successful generation or downstream check does not approve API
            compatibility; preserve this review evidence through the release.
          branch: auto-update/client-generation
          delete-branch: true
          # A breaking removal cannot be merged until a human reviewer marks
          # the PR ready after reviewing the attached report.
          draft: ${{ steps.api-report.outputs.removals_flagged == 'true' && 'always-true' || 'false' }}
          labels: |
            automated
            dependencies
          add-paths: |
            src/**
            docs/**
            README.md
            Cargo.toml
            Cargo.lock
            stainless.yaml
            .openapi-generator-ignore

      # No PAT fallback; fail early if token is missing
      - name: Assert App token present
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
        run: |
          if [ -z "${{ steps.app-token.outputs.token }}" ]; then
            echo "GitHub App token missing. Ensure BOT_APP_ID and BOT_PRIVATE_KEY are configured." >&2
            exit 1
          fi

  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keepalive Workflow
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'generate-client.yml';
            const workflow = await github.rest.actions.getWorkflow({ owner, repo, workflow_id });
            console.log(`Workflow ${workflow.data.name} is ${workflow.data.state}`);
            if (workflow.data.state === 'disabled_inactivity') {
              await github.rest.actions.enableWorkflow({ owner, repo, workflow_id });
              console.log('Workflow re-enabled');
            }
            const runs = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id, per_page: 1 });
            if (runs.data.workflow_runs.length > 0) {
              const lastRun = runs.data.workflow_runs[0];
              console.log(`Last run: ${lastRun.created_at} - Status: ${lastRun.status}`);
            }
